<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Subtle Inner Glow / Highlight -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow for Core Elements -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Protective Shield (Melambangkan Benteng Perlindungan Privasi) -->
  <path d="M256 36
           C340 76 432 88 440 92
           C444 180 436 320 256 476
           C76 320 68 180 72 92
           C80 88 172 76 256 36 Z"
        fill="url(#shieldGrad)"
        filter="url(#softShadow)" />

  <!-- Shield Inner Border Highlight (Aksen Kaca Elegan) -->
  <path d="M256 56
           C332 92 414 103 421 106
           C424 182 417 308 256 450
           C95 308 88 182 91 106
           C98 103 180 92 256 56 Z"
        fill="none"
        stroke="url(#highlightGrad)"
        stroke-width="5"
        stroke-linejoin="round" />

  <!-- Integrated Vault Shackle (Gembok Pelindung di Puncak Chat) -->
  <path d="M196 220
           V178
           C196 145 223 118 256 118
           C289 118 316 145 316 178
           V220"
        fill="none"
        stroke="#ffffff"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Chat Bubble Body (Gelembung Pesan WhatsApp yang Terlindungi) -->
  <path d="M160 210
           H352
           C374 210 392 228 392 250
           V326
           C392 348 374 366 352 366
           H224
           L168 406
           V366
           H160
           C138 366 120 348 120 326
           V250
           C120 228 138 210 160 210 Z"
        fill="#ffffff" />

  <!-- The Local-First Core Vault (Titik Inti Data Lokal: Lingkaran Aman di Pusat) -->
  <!-- Lingkaran Luar (Ring of Isolation) -->
  <circle cx="256" cy="288" r="38" fill="#ecfdf5" />

  <!-- Inti Data Pribadi (Local Data Dot) & Kunci Keamanan -->
  <circle cx="256" cy="284" r="18" fill="#059669" />
  <path d="M251 286 L261 286 L264 308 L248 308 Z" fill="#059669" />
</svg>
